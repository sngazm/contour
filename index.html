<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f4ef" />
  <title>TOPOPO — versions</title>
  <style>
    :root { --ink: #26251f; --sub: #8a877d; --line: #d9d7cf; --paper: #f5f4ef; --accent: #e0512e; --peak: #c8920a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      -webkit-font-smoothing: antialiased;
      padding: max(28px, env(safe-area-inset-top)) 20px 60px;
      max-width: 720px; margin: 0 auto;
    }
    header { margin: 12px 4px 26px; }
    h1 { font-size: 34px; letter-spacing: 0.28em; margin: 0; font-weight: 700; }
    header p { color: var(--sub); font-size: 13px; margin: 10px 0 0; letter-spacing: 0.02em; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; margin: 12px 0; background: #fbfbf8;
      transition: transform .08s ease, border-color .15s ease;
    }
    a.card:active { transform: scale(0.99); }
    a.card.latest { border-color: var(--ink); }
    .row { display: flex; align-items: baseline; gap: 10px; }
    .tag { font-size: 18px; font-weight: 700; }
    .title { font-size: 15px; }
    .badge {
      margin-left: auto; font-size: 11px; letter-spacing: .1em;
      color: var(--paper); background: var(--accent);
      padding: 2px 8px; border-radius: 999px;
    }
    .date { color: var(--sub); font-size: 12px; }
    .note { color: #4a483f; font-size: 13px; line-height: 1.6; margin: 9px 0 0; }
    .play { color: var(--accent); font-size: 13px; margin-top: 10px; }
    header a.about { color: var(--accent); font-size: 13px; text-decoration: none; letter-spacing: .04em; }
    a.daily {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;
      border: 1px solid var(--ink); border-radius: 14px; padding: 14px 18px; margin: 14px 0 18px;
      background: #fbfbf8; transition: transform .08s ease;
    }
    a.daily:active { transform: scale(0.99); }
    a.daily .sun { font-size: 20px; color: var(--peak); }
    a.daily .dl-title { font-size: 15px; font-weight: 700; }
    a.daily .dl-note { color: var(--sub); font-size: 12px; margin-top: 3px; }
    a.daily .go { margin-left: auto; color: var(--accent); font-size: 13px; }
    footer { color: var(--sub); font-size: 11px; margin: 30px 4px 0; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <h1>TOPOPO</h1>
    <p>等高線の地形を歩く実験。バージョン一覧。</p>
    <p style="margin-top:8px"><a class="about" href="./story.html">→ ストーリー</a>　<a class="about" href="./about.html">→ このゲームのねらい</a></p>
  </header>
  <a class="daily" href="./p/01-contour/?daily">
    <span class="sun">☼</span>
    <span>
      <span class="dl-title">デイリーチャレンジ</span>
      <span class="dl-note" id="dl-date">今日の日付がシード・全員同じ地形</span>
    </span>
    <span class="go">▶ 今日の地形へ</span>
  </a>
  <main id="list">読み込み中…</main>
  <footer>
    各カードをタップでその版が遊べます（過去版は当時のまま凍結）。
  </footer>

  <script>
    // デイリーの日付表示（JST = UTC+9）
    (function () {
      const d = new Date(Date.now() + 9 * 3600 * 1000);
      const p2 = (n) => String(n).padStart(2, '0');
      const label = d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate());
      const el = document.getElementById('dl-date');
      if (el) el.textContent = '☼ ' + label + ' ・ 全員同じ地形';
    })();
    fetch('./versions.json')
      .then((r) => r.json())
      .then((vs) => {
        document.getElementById('list').innerHTML = vs.map((v) => `
          <a class="card ${v.latest ? 'latest' : ''}" href="${v.href}">
            <div class="row">
              <span class="tag">${v.v}</span>
              <span class="title">${v.title}</span>
              ${v.latest ? '<span class="badge">LATEST</span>' : '<span class="date" style="margin-left:auto">' + v.date + '</span>'}
            </div>
            ${v.latest ? '<div class="date" style="margin-top:6px">' + v.date + '</div>' : ''}
            <p class="note">${v.note}</p>
            <div class="play">▶ あそぶ</div>
          </a>
        `).join('');
      })
      .catch(() => { document.getElementById('list').textContent = 'versions.json を読み込めませんでした'; });
  </script>
</body>
</html>
