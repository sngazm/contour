<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e7e6e0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TOPOPO</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e7e6e0; overflow: hidden; }
    body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; touch-action: none; }

    #viewbtn {
      position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
      width: 54px; height: 54px; border-radius: 50%;
      border: 1.5px solid rgba(40,39,35,0.35); background: rgba(247,246,242,0.82);
      color: #26251f; display: grid; place-items: center; padding: 0; cursor: pointer;
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); touch-action: manipulation;
    }
    #viewbtn svg { width: 24px; height: 24px; display: block; }
    #viewbtn:active { transform: scale(0.94); }
    #viewbtn.hot { color: #f7f6f2; background: #e0512e; border-color: #e0512e; animation: flagpulse 1s ease-in-out infinite; }
    @keyframes flagpulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224,81,46,0.55); }
      50% { box-shadow: 0 0 0 10px rgba(224,81,46,0); }
    }

    /* タイトル画面のリンク（ready のときだけ表示）。画面下に versions / story を並べる */
    #links {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: none; flex-direction: row; gap: 24px; z-index: 5;
    }
    body.titlescreen #links { display: flex; }
    #links a {
      display: inline-flex; align-items: center; gap: 6px;
      font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.08em;
      color: rgba(40,39,35,0.5); text-decoration: none; padding: 6px 4px;
    }
    #links a:active { color: rgba(40,39,35,0.8); }
    #links svg { width: 15px; height: 15px; display: block; }

    /* デイリーチャレンジ（円の下中央・ready かつ通常モードのとき表示）。普通のテキストリンク */
    #dailycta {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(50% + min(46vw, 46vh) + 22px);
      display: none;
      font: 13px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em;
      color: #c8920a; text-decoration: none; padding: 8px 10px; white-space: nowrap;
    }
    body.titlescreen:not(.dailymode) #dailycta { display: block; }
    #dailycta:active { color: #a87a08; }

    /* リザルトの共有ボタン（画像／回転動画）。右下に縦並び。 */
    #share {
      position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
      display: none; flex-direction: column; gap: 12px; z-index: 6;
    }
    #share.on { display: flex; }
    #share button {
      width: 50px; height: 50px; border-radius: 50%;
      border: 1.5px solid rgba(40,39,35,0.3); background: rgba(247,246,242,0.9);
      color: #26251f; display: grid; place-items: center; padding: 0; cursor: pointer;
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); touch-action: manipulation;
    }
    #share button svg { width: 23px; height: 23px; display: block; }
    #share button:active { transform: scale(0.94); }
    #share button:disabled { opacity: 0.5; }
    #share button.rec { color: #f7f6f2; background: #e0512e; border-color: #e0512e; animation: flagpulse 1s ease-in-out infinite; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button id="viewbtn" aria-label="flag"></button>
  <div id="share">
    <button id="shareVid" aria-label="share video"></button>
    <button id="shareImg" aria-label="share image"></button>
  </div>
  <a id="dailycta" href="/?daily">☼ Daily Challenge</a>
  <nav id="links">
    <a href="/versions/">≡ versions</a>
    <a href="/story.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C10 4.8 7.5 4.3 5 4.6v12c2.5-.3 5 .2 7 1.4 2-1.2 4.5-1.7 7-1.4v-12c-2.5-.3-5 .2-7 1.4z"/><path d="M12 6v12.4"/></svg> story</a>
  </nav>
  <script type="module">
    import { start } from './p/01-contour/game.js';
    start(document.getElementById('c'));
  </script>
</body>
</html>
